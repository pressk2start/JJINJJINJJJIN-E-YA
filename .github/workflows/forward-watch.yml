name: Forward watch

# 등록된 후보를 매일 새 자료로 채점해 scalp/research/forward/ 의 장부와 현황을 갱신한다 (고문 판정 2026-11-17 ①).
# 예약은 하루 세 번 걸려 있다. 그날(UTC) 이미 경고 없이 끝난 실행이 있으면 뒤의 예약은 시세를 받지 않고 바로 끝난다.
# 앞의 실행이 실패했으면 뒤의 예약이 다시 한다. GitHub 예약은 몇 시간씩 늦게 시작되기도 한다(2026-11-16 에 6시간 44분).
# 판정은 표본이 찼을 때 한 번만 하므로 실행 주기와 무관하다. 김치 프리미엄(H2)만은 실행하는 날의 상장 목록으로 계산해 반영 주기가
# 결과를 바꾸므로, 등록된 절차대로 주 1회(그 주 월요일 이후 첫 성공 실행)만 반영한다 (고문 판정 2026-11-14). 나머지 항목은 매일 반영한다.
# 텔레그램 요약은 하루 한 통: 그날 처음 경고 없이 끝난 실행이 보낸다. 세 번이 다 실패한 날은 마지막 예약이 경고를 실어 보낸다.
# 사람이 직접 돌린 실행(workflow_dispatch)과 이 파일이 main 에 반영될 때의 실행은 그날 이미 끝났어도 돌고, 끝나면 요약을 보낸다.
# 공개 시세만 쓴다(키 없음). 거래 서버와 무관하고 봇 코드는 건드리지 않는다.
# 배포(deploy.yml)는 사람이 직접 실행할 때만 돈다 — 이 워크플로가 main 에 올리는 커밋은 배포를 일으키지 않는다.
on:
  schedule:
    - cron: "25 0 * * *"   # 매일 00:25 UTC = 09:25 KST
    - cron: "25 4 * * *"   # 13:25 KST — 앞의 실행이 실패했거나 빠졌을 때만 실제로 돈다
    - cron: "25 8 * * *"   # 17:25 KST — 위와 같다. 그날의 마지막 예약
  # 이 파일을 main 에 반영하면 즉시 한 번 돌려 본다. 장부 커밋은 이 경로에 해당하지 않는다.
  push:
    branches: [main]
    paths: [.github/workflows/forward-watch.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-records
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120          # 시작 시각부터 다시 받으므로 주마다 약 1분씩 늘어난다 (2026-11 현재 약 10분)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 예약 실행만 묻는다. 장부의 날짜만 읽는다(시세 조회 없음). 점검 자체가 실패하면 '아직 안 끝남' 으로 보고 실행한다.
      - name: Already done today (scheduled runs only)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          if python -X utf8 scalp/research/forward_watch.py --done-today; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Update ledger and status
        id: run
        if: steps.gate.outputs.skip != '1'
        run: |
          set +e
          python -X utf8 scalp/research/forward_watch.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "forward-watch"
          git config user.email "forward-watch@users.noreply.github.com"
          git add scalp/research/forward
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "forward-watch: 장부·현황 갱신 $(date -u +%F)"
            # 탐색(Discover)이 같은 폴더의 다른 파일을 같은 때에 올릴 수 있다 — 밀리면 다시 받아서 올린다
            for try in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((try * 15))
            done
            exit 1
          fi
      - name: Show status
        if: steps.gate.outputs.skip != '1'
        run: cat scalp/research/forward/STATUS.md >> "$GITHUB_STEP_SUMMARY" || true
      # 하루 한 통. 예약 실행은 경고 없이 끝났을 때만 보낸다(같은 날 뒤의 예약은 위에서 건너뛴다). 그날의 마지막 예약은 실패했어도
      # 경고를 실어 보낸다 — 세 번이 다 실패한 날에도 진행 숫자는 받는다. 사람이 돌린 실행과 push 실행은 결과와 무관하게 보낸다.
      # 비밀값 이름은 봇의 .env · 고문의 auto-monitor 와 같게 쓴다 (TELEGRAM_TOKEN, TG_CHATS = 쉼표로 구분한 채팅 ID).
      - name: Telegram daily summary (only when both secrets exist)
        if: ${{ steps.gate.outputs.skip == '1' || (steps.gate.outputs.skip != '1' && (steps.run.outputs.code == '0' || github.event_name != 'schedule' || github.event.schedule == '25 8 * * *')) }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        run: |
          python -X utf8 scalp/research/forward_watch.py --summary > "$RUNNER_TEMP/summary.txt"
          python -X utf8 scalp/research/send_daily_summary.py "$RUNNER_TEMP/summary.txt"
      - name: Save summary receipt
        run: |
          git config user.name "forward-watch"
          git config user.email "forward-watch@users.noreply.github.com"
          git add scalp/research/forward/ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "forward-watch: 요약 전달 확인 $(date -u +%F)"
            for try in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((try * 15))
            done
            exit 1
          fi
      - name: Fail if any candidate could not be updated
        if: steps.gate.outputs.skip != '1' && steps.run.outputs.code != '0'
        run: exit 1
      # 실행이 실패했거나 갱신 못 한 후보가 있으면 한 줄 알린다 (고문 요청 2026-11-13). 비밀값이 없으면 아무것도 하지 않는다.
      - name: Telegram on failure (only when both secrets exist)
        if: ${{ failure() || cancelled() }}   # 시간 초과로 취소된 경우도 알린다
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -X utf8 scalp/research/tg_send.py --text "[후보 추적] 일간 실행 실패 또는 갱신 못 한 항목 있음 — ${RUN_URL}"
