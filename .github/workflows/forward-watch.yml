name: Forward watch

# 등록된 후보(H2·H3)를 매주 새 자료로 채점해 scalp/research/forward/ 의 장부와 현황을 갱신한다.
# 공개 시세만 쓴다(키 없음). 거래 서버와 무관하고 봇 코드는 건드리지 않는다.
# 배포(deploy.yml)는 사람이 직접 실행할 때만 돈다 — 이 워크플로가 main 에 올리는 커밋은 배포를 일으키지 않는다.
on:
  schedule:
    - cron: "17 1 * * 1"   # 매주 월요일 01:17 UTC = 10:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update ledger and status
        id: run
        run: |
          set +e
          python -X utf8 scalp/research/forward_watch.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit changes
        run: |
          git config user.name "forward-watch"
          git config user.email "forward-watch@users.noreply.github.com"
          git add scalp/research/forward
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "forward-watch: 장부·현황 갱신 $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Show status
        run: cat scalp/research/forward/STATUS.md >> "$GITHUB_STEP_SUMMARY" || true
      # 비밀값 이름은 봇의 .env · 고문의 auto-monitor 와 같게 쓴다 (TELEGRAM_TOKEN, TG_CHATS = 쉼표로 구분한 채팅 ID).
      - name: Telegram (optional, only when both secrets exist)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        run: |
          python -X utf8 scalp/research/forward_watch.py --summary > "$RUNNER_TEMP/summary.txt"
          python -X utf8 scalp/research/tg_send.py "$RUNNER_TEMP/summary.txt"
      - name: Fail if any candidate could not be updated
        if: steps.run.outputs.code != '0'
        run: exit 1
      # 실행이 실패했거나 갱신 못 한 후보가 있으면 한 줄 알린다 (고문 요청 2026-11-13). 비밀값이 없으면 아무것도 하지 않는다.
      - name: Telegram on failure (only when both secrets exist)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -X utf8 scalp/research/tg_send.py --text "[후보 추적] 주간 실행 실패 또는 갱신 못 한 항목 있음 — ${RUN_URL}"
