name: Lead-lag public research checks
on:
  push:
    branches: ["claude/review-codebase-7fOpB"]
    paths:
      - "scalp/research/leadlag.py"
      - "scalp/research/leadlag_peek.py"
      - "tests/test_leadlag_opportunity.py"
      - ".github/workflows/leadlag-collector.yml"
  pull_request:
    paths:
      - "scalp/research/leadlag.py"
      - "scalp/research/leadlag_peek.py"
      - "tests/test_leadlag_opportunity.py"
      - ".github/workflows/leadlag-collector.yml"
permissions:
  contents: read
jobs:
  collector-selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install public WebSocket client
        run: python -m pip install "websockets>=12,<17"
      - name: Syntax and offline selftest
        run: |
          python -m py_compile scalp/research/leadlag.py scalp/research/leadlag_peek.py tests/test_leadlag_opportunity.py
          python -X utf8 scalp/research/leadlag.py selftest
          python scalp/research/leadlag.py collect --help
          python -X utf8 -m unittest discover -s tests -p "test_leadlag_opportunity.py" -v
          python scalp/research/leadlag_peek.py --opportunity-audit --help
