name: P1 offline ledger audit
on:
  push:
    branches: ["claude/review-codebase-7fOpB"]
    paths:
      - "research/p1_ledger_audit.py"
      - "scalp/research/micro_edge_probe.py"
      - "tests/test_micro_edge_probe.py"
      - "tests/test_candle_compare.py"
      - "tests/test_order_execution_speed.py"
      - "tests/test_maker_fill_replay.py"
      - "scalp/research/maker_fill_replay.py"
      - "tests/test_p1_*.py"
      - "tests/test_trade_features_header_migrate.py"
      - "bot.py"
      - ".github/workflows/p1-ledger-audit.yml"
  pull_request:
    paths:
      - "research/p1_ledger_audit.py"
      - "scalp/research/micro_edge_probe.py"
      - "tests/test_micro_edge_probe.py"
      - "tests/test_candle_compare.py"
      - "tests/test_order_execution_speed.py"
      - "tests/test_maker_fill_replay.py"
      - "scalp/research/maker_fill_replay.py"
      - "tests/test_p1_*.py"
      - "tests/test_trade_features_header_migrate.py"
      - "bot.py"
      - ".github/workflows/p1-ledger-audit.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile bot.py research/p1_ledger_audit.py scalp/research/micro_edge_probe.py tests/test_p1_*.py tests/test_trade_features_header_migrate.py tests/test_micro_edge_probe.py tests/test_candle_compare.py tests/test_order_execution_speed.py tests/test_maker_fill_replay.py scalp/research/maker_fill_replay.py
      - name: P1 source and analyzer tests (isolated, synthetic data)
        run: |
          python -m unittest discover -s tests -p 'test_p1_*.py' -v
          python -m unittest discover -s tests -p 'test_trade_features_header_migrate.py' -v
          python -m unittest discover -s tests -p 'test_micro_edge_probe.py' -v
          python -m unittest discover -s tests -p 'test_candle_compare.py' -v
      - name: Actual close-path Telegram isolation and Maker execution guards
        run: |
          python -m unittest discover -s tests -p 'test_order_execution_speed.py' -v
          python -m unittest discover -s tests -p 'test_maker_fill_replay.py' -v
