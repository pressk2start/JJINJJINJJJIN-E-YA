name: P1 offline ledger audit
on:
  push:
    branches: ["claude/review-codebase-7fOpB"]
    paths:
      - "research/p1_ledger_audit.py"
      - "tests/test_p1_ledger_audit.py"
      - ".github/workflows/p1-ledger-audit.yml"
  pull_request:
    paths:
      - "research/p1_ledger_audit.py"
      - "tests/test_p1_ledger_audit.py"
      - ".github/workflows/p1-ledger-audit.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile research/p1_ledger_audit.py tests/test_p1_ledger_audit.py
      - name: Actual analyzer tests (synthetic data, no network or exchange)
        run: python -m unittest discover -s tests -p test_p1_ledger_audit.py -v
