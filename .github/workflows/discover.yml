name: Discover

# 달마다 '사건 × 조건 하나 × 보유 시간' 틀에서 후보를 찾아 scalp/research/forward/ 에 기록한다 (discover.py).
# 공개 시세만 쓴다(키 없음). 거래 서버와 무관하고 봇 코드는 건드리지 않는다.
# 틀이 초안인 동안(discover.py 의 FRAME_APPROVED=False)은 탐색 기록(DISCOVERY.md)만 남기고 후보를 등록하지 않는다.
# 등록된 후보의 채점과 판정은 Forward watch 가 매주 한다.
on:
  schedule:
    - cron: "7 2 1 * *"    # 매달 1일 02:07 UTC = 11:07 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Search and register
        run: python -X utf8 scalp/research/discover.py --register
      - name: Commit changes
        run: |
          git config user.name "discover"
          git config user.email "discover@users.noreply.github.com"
          git add scalp/research/forward
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "discover: 후보 탐색 기록 $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Show result
        run: cat scalp/research/forward/DISCOVERY.md >> "$GITHUB_STEP_SUMMARY" || true
      # 실행이 실패하면 한 줄 알린다 (고문 요청 2026-11-13). 비밀값이 없으면 아무것도 하지 않는다.
      - name: Telegram on failure (only when both secrets exist)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHATS" ]; then echo "telegram not configured"; exit 0; fi
          for chat in $(echo "$TG_CHATS" | tr ',' ' '); do
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" --data-urlencode "text=[후보 탐색] 월간 실행 실패 — ${RUN_URL}"
          done
