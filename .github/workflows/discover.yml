name: Discover

# 매주 탐색 결과를 점검하고, 매월에만 후보를 등록한다. '사건 × 조건 하나 × 보유 시간' 틀로 scalp/research/forward/ 에 기록한다 (discover.py).
# 공개 시세만 쓴다(키 없음). 거래 서버와 무관하고 봇 코드는 건드리지 않는다.
# 등록 잠금은 2026-11-13 고문 승인으로 풀려 있다(discover.py 의 FRAME_APPROVED). 사건 종류마다 진행 중인 후보는 1개까지만 등록한다.
# 등록된 후보의 채점과 판정은 Forward watch 가 매일 한다.
on:
  schedule:
    - cron: "7 2 1 * *"    # 매달 1일 11:07 KST: 정식 탐색·등록
    - cron: "37 3 * * 1"   # 매주 월요일 12:37 KST: 탐색 점검·기록
  push:
    branches: [main]
    paths: [.github/workflows/discover.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic = 탐색 점검 / monthly = 정식 탐색·등록"
        type: choice
        default: diagnostic
        options: [diagnostic, monthly]

permissions:
  contents: write

concurrency:
  # 월간 등록은 일간 채점과 직렬화하고, 별도 폴더의 진단 탐색은 동시에 계산한다.
  group: ${{ (github.event.schedule == '7 2 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'monthly')) && 'research-records' || 'research-diagnostic' }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select diagnostic or monthly run
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$CRON" = "7 2 1 * *" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_MODE" = "monthly" ]; }; then
            echo "args=--register" >> "$GITHUB_OUTPUT"
            echo "out=scalp/research/forward" >> "$GITHUB_OUTPUT"
          else
            echo "args=--report-only" >> "$GITHUB_OUTPUT"
            echo "out=scalp/research/forward/weekly_discovery" >> "$GITHUB_OUTPUT"
          fi
      - name: Search and record
        env:
          MODE_ARGS: ${{ steps.mode.outputs.args }}
          REPORT_OUT: ${{ steps.mode.outputs.out }}
        run: python -X utf8 scalp/research/discover.py "$MODE_ARGS" --out "$REPORT_OUT"
      - name: Commit changes
        run: |
          git config user.name "discover"
          git config user.email "discover@users.noreply.github.com"
          git add scalp/research/forward
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "discover: 후보 탐색 기록 $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Show result
        env:
          REPORT_OUT: ${{ steps.mode.outputs.out }}
        run: cat "$REPORT_OUT/DISCOVERY.md" >> "$GITHUB_STEP_SUMMARY"
      # 실행이 실패하면 한 줄 알린다 (고문 요청 2026-11-13). 비밀값이 없으면 아무것도 하지 않는다.
      - name: Telegram on failure (only when both secrets exist)
        if: ${{ failure() || cancelled() }}   # 시간 초과로 취소된 경우도 알린다
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -X utf8 scalp/research/tg_send.py --text "[후보 탐색] 실행 실패 — ${RUN_URL}"
