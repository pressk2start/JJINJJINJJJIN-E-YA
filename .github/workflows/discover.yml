name: Discover

# 매주 월요일과 매월 1일에 후보를 탐색하고, 넘은 것은 등록한다 (고문 판정 2026-11-17 ①. 둘 다 --register).
# '사건 × 조건 하나 × 보유 시간' 틀로 scalp/research/forward/ 에 기록한다 (discover.py).
# 등록 상한은 그대로다: 사건 종류마다 진행 중인 후보 1개까지, 달력 한 달에 3개까지(그 달의 실행을 모두 합쳐서).
# 등록 잠금은 2026-11-13 고문 승인으로 풀려 있다(discover.py 의 FRAME_APPROVED).
# 등록된 후보의 채점과 판정은 Forward watch 가 매일 한다.
# 공개 시세만 쓴다(키 없음). 거래 서버와 무관하고 봇 코드는 건드리지 않는다.
on:
  schedule:
    - cron: "7 2 1 * *"    # 매달 1일 11:07 KST: 탐색·등록
    - cron: "37 3 * * 1"   # 매주 월요일 12:37 KST: 탐색·등록
  # 이 파일을 main 에 반영하면 등록 없이 한 번 돌려 본다(결과는 별도 폴더에만 남는다).
  push:
    branches: [main]
    paths: [.github/workflows/discover.yml]
  workflow_dispatch:
    inputs:
      mode:
        description: "register = 탐색·등록(예약 실행과 같음) / diagnostic = 등록 없이 별도 폴더에 결과만 기록"
        type: choice
        default: register
        options: [register, diagnostic]

permissions:
  contents: write

concurrency:
  # 추적(Forward watch)과 묶지 않는다. 같은 묶음에서 기다리는 실행은 하나만 남고 나머지는 취소되는데, 추적 예약이 하루 세 번이라
  # 한 시간 걸리는 탐색이 그 사이에서 취소될 수 있다. 두 워크플로는 서로 다른 파일을 올리고, 밀리면 다시 받아서 올린다.
  group: research-search
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select register or diagnostic run
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_MODE" != "diagnostic" ]; }; then
            echo "args=--register" >> "$GITHUB_OUTPUT"
            echo "out=scalp/research/forward" >> "$GITHUB_OUTPUT"
          else
            echo "args=--report-only" >> "$GITHUB_OUTPUT"
            echo "out=scalp/research/forward/weekly_discovery" >> "$GITHUB_OUTPUT"
          fi
      - name: Search and record
        env:
          MODE_ARGS: ${{ steps.mode.outputs.args }}
          REPORT_OUT: ${{ steps.mode.outputs.out }}
        run: python -X utf8 scalp/research/discover.py "$MODE_ARGS" --out "$REPORT_OUT"
      - name: Commit changes
        run: |
          git config user.name "discover"
          git config user.email "discover@users.noreply.github.com"
          git add scalp/research/forward
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "discover: 후보 탐색 기록 $(date -u +%F)"
            # 추적(Forward watch)이 같은 폴더의 다른 파일을 같은 때에 올릴 수 있다 — 밀리면 다시 받아서 올린다
            for try in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              sleep $((try * 15))
            done
            exit 1
          fi
      - name: Show result
        env:
          REPORT_OUT: ${{ steps.mode.outputs.out }}
        run: cat "$REPORT_OUT/DISCOVERY.md" >> "$GITHUB_STEP_SUMMARY"
      # 실행이 실패하면 한 줄 알린다 (고문 요청 2026-11-13). 비밀값이 없으면 아무것도 하지 않는다.
      - name: Telegram on failure (only when both secrets exist)
        if: ${{ failure() || cancelled() }}   # 시간 초과로 취소된 경우도 알린다
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -X utf8 scalp/research/tg_send.py --text "[후보 탐색] 실행 실패 — ${RUN_URL}"
