name: Deploy to Lightsail

# 서버는 이 버튼을 누를 때만 바뀐다 (2026-11-12, 고문 결정).
#   main 에 merge 해도 이 워크플로는 돌지 않는다. 실행: Actions → Deploy to Lightsail → Run workflow (브랜치는 main).
#   check  (기본값): 서버의 코드와 프로세스를 건드리지 않는다. 서버 커밋, main 과의 차이, deploy 하면 봇이 재시작되는지를 보여 주고,
#                    끝에 '배포할 커밋 번호' 를 찍는다.
#   deploy         : check 가 찍어 준 커밋 번호를 sha 칸에 넣어야 돈다. 그 번호가 지금의 main 과 다르면(그 사이 다른 merge 가
#                    들어왔으면) 배포하지 않는다 — 검토하지 않은 코드가 같이 올라가는 것을 막는다 (2026-11-14 검토 반영).
#   deploy 를 고르기 전에: 보유 0, 고문 검토 완료.
# 서버 cron 의 auto_deploy.sh(매분 수신)는 이 파일과 별개다. 그것이 켜져 있는 동안은 merge 가 1분 안에 서버로 간다.
# 이 파일을 고치면 tests/test_deploy_manual.py 도 같이 본다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check = 차이만 보기(서버 안 바뀜) · deploy = 실제 배포(보유 0·고문 검토 확인 후)"
        type: choice
        required: true
        default: check
        options:
          - check
          - deploy
      sha:
        description: "deploy 일 때만: check 결과 끝에 찍힌 커밋 번호 (7자 이상). 지금의 main 과 다르면 배포하지 않는다"
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: main 에서만 실행
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::이 워크플로는 main 에서만 실행한다 (지금: $GITHUB_REF)"
          exit 1
      - name: SSH (${{ inputs.action }})
        uses: appleboy/ssh-action@v1.0.3
        env:
          ACTION: ${{ inputs.action }}
          SHA: ${{ inputs.sha }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: ACTION,SHA
          script: |
            set -e
            cd /home/ubuntu/bot
            echo "=== 서버 커밋 ==="
            git log --oneline -1
            git fetch origin main -q
            echo "=== main 에 있고 서버에 없는 커밋 ==="
            git log --oneline HEAD..origin/main | head -30
            echo "=== 바뀌는 파일 ==="
            git diff --stat HEAD origin/main | tail -30
            if git diff --quiet HEAD origin/main -- bot.py; then
              echo "bot.py: 변경 없음"
            else
              echo "bot.py: 변경 있음 - deploy 하면 봇이 재시작된다"
            fi
            echo "=== 실행 중인 봇 ==="
            python3 trend/bot_version_check.py --marker data/h3_reserved.json --bot-file bot.py --pid "$(systemctl show -p MainPID --value upbit-bot 2>/dev/null || echo 0)" || echo "(위 상태면 bot.py 가 안 바뀌어도 deploy 때 봇이 재시작된다)"
            TARGET=$(git rev-parse origin/main)
            if [ "$ACTION" != "deploy" ]; then
              echo "=== check: 서버는 바뀌지 않았다 ==="
              echo "배포할 커밋 번호 (deploy 의 sha 칸에 넣는다): $(git rev-parse --short=12 origin/main)"
              exit 0
            fi
            case "$SHA" in
              ""|*[!0-9a-f]*) echo "deploy 에는 check 가 찍어 준 커밋 번호(sha)가 필요하다"; exit 2 ;;
            esac
            if [ "$(printf %s "$SHA" | wc -c)" -lt 7 ]; then echo "sha 는 7자 이상이어야 한다"; exit 2; fi
            case "$TARGET" in
              "$SHA"*) ;;
              *) echo "main 이 바뀌었다: 승인한 커밋 $SHA, 지금 main $TARGET - 배포하지 않는다. check 부터 다시 할 것"; exit 3 ;;
            esac
            echo "=== deploy start ($TARGET) ==="
            DEPLOY_SHA="$SHA" bash ./deploy_restart.sh
            echo "=== deploy done ==="
