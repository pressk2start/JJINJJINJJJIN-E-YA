name: Deploy to Lightsail

on:
  workflow_dispatch: # Actions 화면에서 직접 실행할 때만 배포

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "=== deploy start ==="
            cd /home/ubuntu/bot
            echo "=== current commit ==="
            git log --oneline -1
            bash ./deploy_restart.sh
            echo "=== deploy done ==="
