name: Deploy to Lightsail

on:
  push:
    branches:
      - main
    # 연구 전용 경로만 바뀐 푸시에는 서버에 접속하지 않는다 (2026-11-11).
    # 위에서 아래로 적용되고 마지막에 맞은 줄이 이긴다. 아래에 없는 경로는 전부 배포 대상이다 — 모르는 파일은 배포하는 쪽이 안전하다.
    # 이 목록을 고치면 tests/test_deploy_paths.py 도 같이 본다.
    paths:
      - "**"
      - "!scalp/research/**"               # 연구 스크립트, 추적 장부(forward/)
      - "scalp/research/trend_paper.py"    # 단, H3 실행기가 서버에서 불러 쓰는 파일은 배포한다
      - "!tests/**"
      - "!docs/**"
      - "!**.md"
      - "!.github/**"                      # 워크플로 설정 — 서버는 쓰지 않는다
      - "!.gitignore"
      - "!**/.gitignore"
  workflow_dispatch:                       # 필요할 때 Actions 화면에서 직접 배포 (경로 조건 없이 실행)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            echo "=== deploy start ==="
            cd /home/ubuntu/bot
            echo "=== current commit ==="
            git log --oneline -1
            bash ./deploy_restart.sh
            echo "=== deploy done ==="
