name: Schedule watchdog

# 예약 실행이 빠졌는지 본다 (2026-11-13). Forward watch 는 월요일, 이 점검은 수요일에 돈다.
# 장부의 마지막 실행일이 8일, 탐색 기록의 마지막 실행일이 35일 넘게 묵었으면 실패로 끝나고 텔레그램으로 한 줄 알린다.
# 저장소에 아무것도 쓰지 않는다. 시세도 받지 않는다(장부 파일의 날짜만 읽는다).
# 한계: GitHub 예약 자체가 통째로 멈추면 이 점검도 돌지 않는다. 월요일 요약이 안 오는 것이 그 신호다.
on:
  schedule:
    - cron: "17 1 * * 3"   # 매주 수요일 01:17 UTC = 10:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Are the scheduled runs up to date
        run: python -X utf8 scalp/research/forward_watch.py --stale-check | tee "$RUNNER_TEMP/stale.txt"; exit "${PIPESTATUS[0]}"
      - name: Telegram on failure (only when both secrets exist)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHATS" ]; then echo "telegram not configured"; exit 0; fi
          { echo "[예약 점검] 자동 실행이 빠졌습니다"; cat "$RUNNER_TEMP/stale.txt" 2>/dev/null || true; } > "$RUNNER_TEMP/msg.txt"
          for chat in $(echo "$TG_CHATS" | tr ',' ' '); do
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat}" --data-urlencode "text@${RUNNER_TEMP}/msg.txt"
          done
