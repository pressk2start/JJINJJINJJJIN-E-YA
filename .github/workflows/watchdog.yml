name: Schedule watchdog

# 일간 추적과 월간 정식 탐색의 실행 누락을 매일 확인한다.
# 가장 최근에 지난 예약일(전날, 매월 1일)의 실행이 기록에 없거나 갱신되지 못한 항목이 있으면 실패로 끝나고 텔레그램으로 알린다.
# 저장소에 아무것도 쓰지 않는다. 시세도 받지 않는다(장부 파일의 날짜만 읽는다).
# 한계: GitHub 예약 자체가 멈추면 이 점검도 멈춘다. 외부에서 실행 기록도 확인한다.
on:
  schedule:
    - cron: "47 5 * * *"   # 매일 14:47 KST: 전날까지의 실행 누락 확인
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Are the scheduled runs up to date
        run: python -X utf8 scalp/research/forward_watch.py --stale-check --daily-schedule | tee "$RUNNER_TEMP/stale.txt"; exit "${PIPESTATUS[0]}"
      - name: Telegram on failure (only when both secrets exist)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
        run: |
          { echo "[예약 점검] 자동 실행이 빠졌거나 갱신되지 못한 항목이 있습니다"; cat "$RUNNER_TEMP/stale.txt" 2>/dev/null || true; } > "$RUNNER_TEMP/msg.txt"
          python3 -X utf8 scalp/research/tg_send.py "$RUNNER_TEMP/msg.txt"
