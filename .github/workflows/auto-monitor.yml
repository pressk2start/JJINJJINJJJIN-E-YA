# 공개 시세만으로 매일 상황을 수집하고, 고정된 규칙의 전진 성적을 누적한다. 주문·거래소 키 없음.
# 저장 위치: .github/workflows/auto-monitor.yml  (예약 실행은 기본 브랜치에 있어야 돈다)
# 선택 시크릿: TELEGRAM_TOKEN, TG_CHATS. 업비트 키를 넣지 않는다.
name: auto-monitor

on:
  schedule:
    - cron: "12 0 * * *"    # 매일 09:12 KST
    - cron: "27 0 * * 1"    # 월요일 09:27 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "daily 또는 weekly"
        type: choice
        default: daily
        options: [daily, weekly]

permissions:
  contents: read

concurrency:
  group: auto-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run offline monitor tests
        run: python3 -m unittest discover -s tests -p "test_auto_monitor.py" -v
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE_IN: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="$MODE_IN"
          elif [ "$SCHEDULE" = "27 0 * * 1" ]; then MODE=weekly
          else MODE=daily; fi
          python3 scalp/research/auto_monitor.py "$MODE" --out report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto-monitor-report
          path: report.txt
          retention-days: 90
          if-no-files-found: ignore
