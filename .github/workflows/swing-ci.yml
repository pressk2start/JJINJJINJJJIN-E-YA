# swing-ci — 오프라인 유닛 테스트 러너 (Q2=(c) CI만 허용 범위).
# 배포 아님: GitHub 러너에서 tests.py(오프라인)만 실행. 서버 무접촉, 시장데이터 관측 없음.
# ⚠ main 브랜치 push는 기존 deploy.yml만 발동 (이 파일도 main에 있으면 함께 트리거되나 서버 무접촉이라 안전).
name: swing-ci
on:
  push:
    branches: ["claude/review-main-code-vSfEc", "**/swing/**"]
    paths: ["swing/**", ".github/workflows/swing-ci.yml"]
  pull_request:
    branches: ["**"]
    paths: ["swing/**", ".github/workflows/swing-ci.yml"]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests
      - name: Run offline unit tests (result-independent · no market data · no perf output)
        working-directory: swing
        run: python3 tests.py
