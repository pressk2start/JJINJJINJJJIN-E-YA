name: Research checks

# 추적기(Forward watch)와 그 규칙 파일의 점검. 공개 시세만 쓴다(키 없음). 저장소에 아무것도 쓰지 않는다.
# 작업 브랜치에 푸시할 때 돌기 때문에, main 에 넣기 전에 GitHub 쪽에서 실제로 도는지(시세가 받아지는지) 확인할 수 있다.
on:
  push:
    branches: ["claude/review-codebase-7fOpB"]
    paths:
      - "scalp/research/forward_watch.py"
      - "scalp/research/auto_monitor.py"
      - "scalp/research/discover.py"
      - "tests/test_forward_watch.py"
      - "tests/test_auto_monitor.py"
      - "tests/test_deploy_manual.py"
      - ".github/workflows/deploy.yml"
      - "tests/test_discover.py"
      - ".github/workflows/research-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline tests
        run: |
          python -X utf8 -m unittest discover -s tests -p "test_forward_watch.py"
          python -X utf8 -m unittest discover -s tests -p "test_auto_monitor.py"
          python -X utf8 -m unittest discover -s tests -p "test_deploy_manual.py"
          if [ -f tests/test_discover.py ]; then python -X utf8 -m unittest discover -s tests -p "test_discover.py"; fi
      - name: Live dry run of the tracker (public data only, nothing is written)
        run: python -X utf8 scalp/research/forward_watch.py --dry-run
      - name: Live small-range run of the monthly search (public data only, nothing is written)
        run: python -X utf8 scalp/research/discover.py --markets KRW-BTC,KRW-ETH,KRW-XRP --days 45 --out "$RUNNER_TEMP/discover"
