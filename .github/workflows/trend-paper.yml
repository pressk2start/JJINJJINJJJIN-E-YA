name: H3 trend paper checks
on:
  push:
    branches: ["claude/review-codebase-7fOpB"]
    paths:
      - "scalp/research/trend_paper.py"
      - "tests/test_trend_paper.py"
      - ".github/workflows/trend-paper.yml"
      - "trend/h3_executor.py"
      - "tests/test_h3_executor.py"
  pull_request:
    paths:
      - "scalp/research/trend_paper.py"
      - "tests/test_trend_paper.py"
      - ".github/workflows/trend-paper.yml"
      - "trend/h3_executor.py"
      - "tests/test_h3_executor.py"
permissions:
  contents: read
jobs:
  paper-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax and offline calendar-cost regressions
        run: |
          python -m py_compile scalp/research/trend_paper.py tests/test_trend_paper.py
          python -X utf8 -m unittest discover -s tests -p "test_trend_paper.py" -v
  # H3 실행기(서버에서 도는 코드)의 오프라인 테스트. 가짜 거래소만 쓴다 — 키·주문·시세 조회 없음.
  executor-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: H3 executor offline tests (fake exchange, no keys, no network)
        run: |
          python -m py_compile trend/h3_executor.py tests/test_h3_executor.py
          python -X utf8 -m unittest discover -s tests -p "test_h3_executor.py"
